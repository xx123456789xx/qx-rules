# Quantumult X - 百度网盘 Cookie 抓取
# 将下面的 YOUR_GITHUB_USERNAME/YOUR_REPO/main 替换为你的 GitHub 用户名、仓库名和分支名。

[rewrite_local]
^https?:\\/\\/pan\\.baidu\\.com\\/.* url script-request-header https://raw.githubusercontent.com/xx123456789xx/qx-rules/refs/heads/main/baidu_cookie.js

